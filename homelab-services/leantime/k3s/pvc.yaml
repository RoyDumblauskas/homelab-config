apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: leantime-publicuserfiles
  namespace: leantime
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  resources:
    requests:
      storage: 5Gi
