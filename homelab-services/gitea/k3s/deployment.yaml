# Define how gitea pod operates
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: gitea
spec:
  replicas: 1

  selector:
    matchLabels:
      app: gitea

  template:
    metadata:
      labels:
        app: gitea

    spec:
      containers:
        - name: gitea
          image: docker.gitea.com/gitea:1.27.2

          ports:
            - name: http
              containerPort: 3000
              protocol: TCP

            - name: ssh
              containerPort: 22
              protocol: TCP

          env:
            - name: GITEA__database__DB_TYPE
              value: postgres

            - name: GITEA__database__HOST
              value: '{{ (datasource "dbhostname") }}'

            - name: GITEA__database__NAME
              value: '{{ (datasource "credentials").GITEA_DB_NAME }}'

            - name: GITEA__database__USER
              value: '{{ (datasource "credentials").GITEA_DB_USER }}'

            - name: GITEA__database__PASSWD
              value: '{{ (datasource "credentials").GITEA_DB_PASS}}'

            - name: GITEA__server__HTTP_PORT
              value: "3000"

            - name: GITEA__server__SSH_PORT
              value: "30222"

            - name: GITEA__repository__MAX_CREATION_LIMIT
              value: "0"

            - name: GITEA__security__INSTALL_LOCK
              value: "true"

            - name: GITEA__security__SECRET_KEY
              value: "randomHex"

          volumeMounts:
            - name: gitea-data
              mountPath: /data

      volumes:
        - name: gitea-data
          persistentVolumeClaim:
            claimName: gitea-persistent-data
